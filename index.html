<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <title>Shubh Electronic - Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #081626; color: #fff; text-align: center; margin: 0; padding: 20px; }
        
        .branding { background: #081626; padding: 20px; border-radius: 16px; border: 1.5px solid #172a3e; box-shadow: 0 8px 24px rgba(0,0,0,0.6); margin-bottom: 30px; }
        .logo-box { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .main-title { font-size: 2.5em; font-weight: 900; color: #ffffff; line-height: 0.95; margin: 0; }
        .sub-title { font-size: 1.1em; font-weight: 800; color: #a8c5db; letter-spacing: 3.5px; margin-top: 3px; }
        .contact { font-size: 1.1em; font-weight: bold; margin-top: 15px; color: #ffd600; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; max-width: 900px; margin: auto; padding: 20px; }
        
        .card { 
            background: linear-gradient(145deg, #1c2541, #0b132b); 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 10px 10px 20px #050a12, -10px -10px 20px #2a3556; 
            transition: 0.4s;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 15px 15px 30px #050a12; border: 1px solid #007bff; }
        
        .btn { 
            display: block; margin-top: 20px; padding: 14px; background: #007bff; 
            color: white; text-decoration: none; border-radius: 12px; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
    </style>
</head>
<body>

    <div class="branding">
        <div class="logo-box">
            <svg width="40" height="52" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 10px #ff6600);">
                <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="#ff6600"/>
            </svg>
            <div style="text-align: left;">
                <div class="main-title">Shubh</div>
                <div class="sub-title">ELECTRONIC</div>
            </div>
        </div>
        <div class="contact">
            📞 Customer Care: <span style="color: #61dafb;">📱 8460 24 24 25</span>
        </div>
    </div>

    <!-- મેનુ બટનો - બધા કાર્ડ આ ગ્રીડની અંદર રહેશે -->
    <div class="menu-grid">
        <div class="card">
            <h3>AC Starter Controller</h3>
            <a href="ac_starter.html" class="btn">Open Controller</a>
        </div>
        <div class="card">
            <h3>Safety Guard Relay</h3>
            <a href="homesafety.html" class="btn">Open Safety</a>
        </div>
        <div class="card">
            <h3>Generator Monitor</h3>
            <a href="genset.html" class="btn">Open Genset</a>
        </div>
        <div class="card">
            <h3 style="color: #00d4ff;">System Settings</h3>
            <a href="settings.html" class="btn" style="background: linear-gradient(145deg, #00d4ff, #0088aa); color: #081626;">Configure</a>
        </div>
    </div>

</body>
</html>
